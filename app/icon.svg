<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 58 358 358">
  <defs>
    <filter id="neoShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feOffset dx="14" dy="14" in="SourceAlpha" result="offset"/>
      <feFlood flood-color="#000000" result="color"/>
